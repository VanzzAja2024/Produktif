name: Build GRIND OS APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip GRIND-OS-Android-Project.zip -d source

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: cd source/GRIND-OS-Android && gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: GRIND-OS-APK
          path: source/GRIND-OS-Android/app/build/outputs/apk/debug/app-debug.apk
